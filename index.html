<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02070b">
<title>MYRIA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.45' cy='.42' r='.6'%3E%3Cstop offset='0' stop-color='%23fff3e2'/%3E%3Cstop offset='.5' stop-color='%23ff9a74'/%3E%3Cstop offset='1' stop-color='%23b8432f'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%2302070b'/%3E%3Cg stroke='%23ff9a74' stroke-width='3' stroke-linecap='round'%3E%3Cpath d='M32 8v10M32 46v10M8 32h10M46 32h10M15 15l7 7M42 42l7 7M49 15l-7 7M22 42l-7 7'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='13' fill='url(%23g)'/%3E%3C/svg%3E">
<style>:root { --ink: #dff3fb; --dim: rgba(190,225,240,.55); --glass: rgba(8,22,32,.72); --line: rgba(140,210,235,.18); --warm: #ffb48a; --cyan: #7fe6ff; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #02070b; overflow: hidden; color: var(--ink); font: 500 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .04em; user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: default; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui button { pointer-events: auto; font: inherit; color: inherit; cursor: pointer; }
/* iris wipe between chambers */
#iris { position: fixed; inset: 0; pointer-events: none; background: #010407; opacity: 0; will-change: opacity, background; }
/* room title: etched small caps that settle and fade */
.h-title { position: absolute; left: 0; right: 0; top: 13%; text-align: center; opacity: 0; transform: translateY(6px); transition: opacity .9s ease, transform 1.2s ease; text-transform: uppercase; }
.h-title.in { opacity: 1; transform: none; }
.h-title .t-no { font-size: 11px; letter-spacing: .5em; color: var(--dim); margin-bottom: 8px; }
.h-title .t-name { font-size: clamp(20px, calc(3.4vmin / var(--k, 1)), 34px); font-weight: 300; letter-spacing: .42em; padding-left: .42em; color: #eaf8ff; text-shadow: 0 0 22px rgba(120,220,255,.35); }
.h-title .t-sub { margin-top: 8px; font-size: 12px; letter-spacing: .3em; color: var(--dim); text-transform: none; }
/* top bar: light, stars */
.h-top { position: absolute; left: 50%; top: max(12px, env(safe-area-inset-top)); transform: translateX(-50%); display: flex; align-items: center; gap: 16px; padding: 7px 16px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); opacity: 0; transition: opacity .5s; font-variant-numeric: tabular-nums; }
.h-top.on { opacity: 1; }
.h-top .mt { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.h-top .mt i { width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle, #fff 0, #ffd98f 45%, rgba(255,200,120,0) 75%); box-shadow: 0 0 10px #ffcf85; }
.h-top .mt small { color: var(--dim); font-size: 12px; }
.h-top .bar { width: 74px; height: 3px; border-radius: 3px; background: rgba(140,210,235,.16); overflow: hidden; position: relative; }
.h-top .bar b { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #ffcf85, #fff3d6); border-radius: 3px; transition: width .35s ease; }
.h-top .bar u { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--cyan); opacity: .8; }
.h-top .st { display: flex; gap: 7px; }
.h-top .st s { width: 9px; height: 9px; transform: rotate(45deg); border: 1px solid rgba(160,225,245,.5); transition: all .4s; text-decoration: none; }
.h-top .st s.on { background: #bfefff; box-shadow: 0 0 9px #7fe6ff; border-color: #dff8ff; }
.h-top .st s.lost { opacity: .28; border-style: dashed; }
.h-top .ex { font-size: 12px; color: var(--dim); }
/* corner pause */
.h-corner { position: absolute; right: max(12px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top)); }
.h-corner button { width: 38px; height: 38px; border-radius: 50%; background: var(--glass); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; gap: 4px; opacity: .7; transition: opacity .2s; }
.h-corner button:hover { opacity: 1; }
.h-corner button span { width: 3px; height: 12px; background: var(--ink); border-radius: 2px; }
/* toasts: named tricks */
.h-toasts { position: absolute; left: 0; right: 0; bottom: 15%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.h-toast { padding: 8px 18px; border-radius: 999px; background: var(--glass); border: 1px solid rgba(255,200,140,.35); font-size: 13px; letter-spacing: .26em; text-transform: uppercase; color: #ffe9d2; animation: toastIn .5s cubic-bezier(.2,1.4,.4,1) both; box-shadow: 0 0 26px rgba(255,170,110,.18); }
.h-toast .g { color: var(--warm); margin-right: 10px; }
.h-toast.cool { border-color: rgba(127,230,255,.4); color: #dff8ff; } .h-toast.cool .g { color: var(--cyan); }
.h-toast.out { opacity: 0; transform: translateY(-10px); transition: all .8s; }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(.9); } to { opacity: 1; transform: none; } }
/* panels: pause, results, hub labels */
.h-veil { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(1,5,9,.55); opacity: 0; transition: opacity .3s; pointer-events: none; }
.h-veil.on { opacity: 1; pointer-events: auto; }
.panel { min-width: min(320px, calc(84vw / var(--k, 1))); max-width: calc(92vw / var(--k, 1)); max-height: calc(94vh / var(--k, 1)); overflow-y: auto; padding: 26px 28px 22px; border-radius: 22px; background: rgba(6,18,27,.9); border: 1px solid var(--line); text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05); }
.panel h2 { margin: 0 0 4px; font-weight: 300; font-size: 22px; letter-spacing: .4em; padding-left: .4em; text-transform: uppercase; }
.panel .sub { color: var(--dim); font-size: 12px; letter-spacing: .22em; margin-bottom: 16px; }
.m-items { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.m-item { padding: 11px 16px; border-radius: 12px; background: rgba(140,210,235,.07); border: 1px solid var(--line); letter-spacing: .2em; text-transform: uppercase; font-size: 12px; transition: background .15s, transform .15s; }
.m-item:hover { background: rgba(140,210,235,.16); transform: translateY(-1px); }
.m-item.pri { background: rgba(255,180,138,.16); border-color: rgba(255,180,138,.4); color: #ffe9d2; }
.m-row { display: flex; gap: 8px; } .m-row .m-item { flex: 1; }
/* result card (shown during the dark between chambers) */
.h-result { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; opacity: 0; transition: opacity .35s; }
.h-result.on { opacity: 1; }
.h-result .r-name { font-size: 12px; letter-spacing: .5em; color: var(--dim); text-transform: uppercase; }
.h-result .r-stars { display: flex; justify-content: center; gap: 26px; margin: 20px 0 14px; }
.h-result .r-star { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 10px; letter-spacing: .3em; color: var(--dim); text-transform: uppercase; opacity: .35; transform: scale(.8); transition: all .45s cubic-bezier(.2,1.6,.4,1); }
.h-result .r-star i { width: 20px; height: 20px; transform: rotate(45deg); border: 1px solid rgba(160,225,245,.5); display: block; }
.h-result .r-star.on { opacity: 1; transform: scale(1); color: #dff8ff; }
.h-result .r-star.on i { background: #cdf3ff; box-shadow: 0 0 22px #7fe6ff, 0 0 60px rgba(127,230,255,.5); border-color: #fff; }
.h-result .r-stats { color: var(--dim); font-size: 12px; letter-spacing: .24em; font-variant-numeric: tabular-nums; }
.h-result .r-stats b { color: var(--ink); font-weight: 500; }
.h-result .r-tricks { margin-top: 12px; color: var(--warm); font-size: 11px; letter-spacing: .3em; text-transform: uppercase; min-height: 16px; }
.h-result .r-next { margin-top: 16px; font-size: 13px; letter-spacing: .44em; text-transform: uppercase; color: #eaf8ff; opacity: 0; transition: opacity .6s; }
.h-result .r-next.on { opacity: 1; }
/* labels pinned to world points (hub pores) */
.h-labels { position: absolute; inset: 0; }
.h-label { position: absolute; transform: translate(-50%, 0); text-align: center; text-transform: uppercase; letter-spacing: .34em; padding-left: .34em; font-size: 12px; color: #dff3fb; text-shadow: 0 0 14px rgba(0,0,0,.9); white-space: nowrap; transition: opacity .4s; }
.h-label small { display: block; margin-top: 4px; font-size: 10px; letter-spacing: .22em; color: var(--dim); text-transform: none; }
.h-label.locked { opacity: .35; }
/* wordless hint glyphs */
/* (it sits on a dark pill: over bright streaks or pale floors bare dim text could not be read — found by playing Fizz, where the flume ran straight through it) */
.h-hint { position: absolute; left: 50%; bottom: 9%; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; color: rgba(236, 240, 255, .9); font-size: 12px; letter-spacing: .2em; opacity: 0; transition: opacity .8s; padding: 7px 18px 7px 12px; border-radius: 999px; background: rgba(6, 8, 20, .58); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08); white-space: nowrap; max-width: 92vw; }
.h-hint.on { opacity: 1; }
.key { display: inline-flex; min-width: 26px; height: 26px; padding: 0 7px; align-items: center; justify-content: center; border-radius: 7px; border: 1px solid rgba(160,225,245,.35); background: rgba(8,22,32,.6); font-size: 11px; letter-spacing: .08em; color: #dff3fb; }
.mouse-ic { width: 16px; height: 24px; border-radius: 8px; border: 1px solid rgba(160,225,245,.5); position: relative; display: inline-block; }
.mouse-ic::after { content: ""; position: absolute; top: 2px; width: 6px; height: 9px; border-radius: 4px 0 0 0; background: var(--cyan); left: 1px; opacity: .9; }
.mouse-ic.r::after { left: auto; right: 1px; border-radius: 0 4px 0 0; background: var(--warm); }
.mouse-ic.m::after { opacity: 0; }
.fatal { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 30px; letter-spacing: .15em; line-height: 1.8; }
/* sandbox tray */
/* the Pool's tools: two rows that scroll sideways — never more than a low strip, however many tools there are (it used to wrap into a wall over a third of the pool) */
.h-tray { position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: calc(94vw / var(--k, 1)); padding: 8px 10px 22px; border-radius: 18px; background: var(--glass); border: 1px solid var(--line); pointer-events: auto; }
.h-tray .row { display: grid; grid-auto-flow: column; grid-template-rows: repeat(2, 36px); grid-auto-columns: 36px; gap: 6px; overflow-x: auto; overscroll-behavior: contain; touch-action: pan-x; scrollbar-width: none; }
.h-tray .row::-webkit-scrollbar { display: none; }
.h-tray button { width: 36px; height: 36px; border-radius: 50%; background: rgba(140,210,235,.07); border: 1px solid var(--line); font-size: 15px; line-height: 1; color: var(--ink); }
.h-tray button.on { background: rgba(255,180,138,.22); border-color: rgba(255,180,138,.6); box-shadow: 0 0 14px rgba(255,170,110,.3); }
.h-tray .tip { position: absolute; left: 8px; right: 8px; bottom: 5px; text-align: center; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-item.locked { opacity: .35; }
/* the sigil that breathes while a chamber develops */
.h-loader { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; opacity: 0; transition: opacity .5s; }
.h-loader.on { opacity: .9; }
.h-loader i { position: absolute; inset: 15px; border-radius: 50%; background: radial-gradient(circle, #fff3e2 0, #ff9a74 55%, rgba(255,150,110,0) 75%); box-shadow: 0 0 18px #ff9a74; animation: ldPulse 1.6s ease-in-out infinite; }
.h-loader::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(255,170,130,.85) 0 5deg, transparent 5deg 40deg); -webkit-mask: radial-gradient(circle, transparent 0 13px, #000 14px 21px, transparent 22px); mask: radial-gradient(circle, transparent 0 13px, #000 14px 21px, transparent 22px); animation: ldSpin 7s linear infinite; }
.h-result.on ~ .h-loader, .h-veil.on ~ .h-loader { opacity: 0; }
@keyframes ldPulse { 0%, 100% { transform: scale(.82); } 50% { transform: scale(1.08); } }
@keyframes ldSpin { to { transform: rotate(360deg); } }
/* chain, multiplier, clock (Bloom) */
.h-top .ex { font-variant-numeric: tabular-nums; color: #cfe8f2; }
.h-top .ex .mu { font-weight: 600; color: var(--dim); transition: color .3s, text-shadow .3s; }
.h-top .ex .mu.hot { color: #ffd98f; text-shadow: 0 0 12px rgba(255,200,120,.8); }
.h-top .ex .warn { color: #ff9a8a; animation: warnBlink .9s ease-in-out infinite; }
@keyframes warnBlink { 50% { opacity: .45; } }
.h-toast small { margin-left: 8px; color: var(--warm); letter-spacing: .1em; }
.medals { display: flex; justify-content: center; gap: 18px; margin: 14px 0 2px; font-size: 10px; letter-spacing: .26em; text-transform: uppercase; color: var(--dim); }
.medals span { display: flex; flex-direction: column; align-items: center; gap: 8px; opacity: .32; }
.medals span i { width: 13px; height: 13px; transform: rotate(45deg); border: 1px solid rgba(255,215,150,.6); display: block; }
.medals span.on { opacity: 1; color: #ffe9d2; }
.medals span.on i { background: #ffe2a8; box-shadow: 0 0 16px #ffcf85, 0 0 40px rgba(255,200,120,.5); border-color: #fff; }
.h-flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 50%, rgba(255,244,225,.95), rgba(255,220,180,.55) 55%, rgba(255,200,150,.25)); mix-blend-mode: screen; }
.ep-stats { display: flex; gap: 26px; justify-content: center; margin: 18px 0 8px; flex-wrap: wrap; }
.ep-stat { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ep-stat b { font-size: 26px; font-weight: 300; letter-spacing: .04em; color: #ffe9c8; }
.ep-stat b small { font-size: 13px; opacity: .5; }
.ep-stat span { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; opacity: .55; }
.panel.wide { max-width: min(820px, calc(96vw / var(--k, 1))); padding: 22px 22px 18px; }
.ch-map { display: flex; flex-direction: column; gap: 12px; margin: 6px 0 2px; text-align: left; }
.ch-row { display: flex; align-items: center; gap: 12px; }
.ch-row > label { flex: 0 0 104px; text-align: right; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink); opacity: .8; line-height: 1.5; }
.ch-row > label small { display: block; opacity: .55; letter-spacing: .14em; }
.ch-cells { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
.ch { width: 82px; min-height: 66px; padding: 7px 3px 6px; border-radius: 12px; background: rgba(140,210,235,.06); border: 1px solid var(--line); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 2px; transition: background .15s, transform .15s; }
.ch:hover { background: rgba(140,210,235,.16); transform: translateY(-1px); }
.ch b { font-size: 15px; font-weight: 300; letter-spacing: .04em; }
.ch span { font-size: 8px; letter-spacing: .1em; text-transform: uppercase; opacity: .75; line-height: 1.25; text-align: center; }
.ch i { font-style: normal; font-size: 9px; letter-spacing: .12em; color: #ffd9a8; }
.ch.locked { opacity: .3; pointer-events: none; }
.ch.boss { border-color: rgba(255,200,140,.5); background: rgba(255,180,138,.07); }
.ch.next { box-shadow: 0 0 16px rgba(255,170,110,.35); border-color: rgba(255,180,138,.75); }
.ch.full i { color: #fff3c9; text-shadow: 0 0 8px rgba(255,220,150,.8); }
@media (max-width: 560px) { .ch-row { flex-direction: column; align-items: stretch; gap: 5px; } .ch-row > label { flex: none; text-align: left; } .ch-row > label small { display: inline; margin-left: 8px; } .ch { width: calc((100% - 24px) / 5); min-width: 58px; } }
.tk-list { display: flex; flex-direction: column; gap: 5px; margin: 6px 0 2px; text-align: left; min-width: min(520px, calc(84vw / var(--k, 1))); }
.tk { display: grid; grid-template-columns: 200px 1fr 34px; align-items: baseline; gap: 12px; padding: 8px 12px; border-radius: 10px; background: rgba(140,210,235,.04); border: 1px solid transparent; }
.tk b { font-weight: 400; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.tk span { font-size: 12px; letter-spacing: .04em; color: var(--dim); font-style: italic; }
.tk i { font-style: normal; font-size: 11px; color: var(--dim); text-align: right; }
.tk.on { background: rgba(255,180,138,.08); border-color: rgba(255,180,138,.25); } .tk.on b { color: #ffe1bd; } .tk.on span { color: var(--ink); opacity: .8; }
@media (max-width: 560px) { .tk { grid-template-columns: 1fr 30px; } .tk span { grid-column: 1 / -1; grid-row: 2; } }
</style>
</head>
